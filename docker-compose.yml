# ─────────────────────────────────────────────────────────────────────────────
# CarbonTracker AI — Docker Compose (Production)
# Services: frontend, backend, database (PostgreSQL)
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

services:

  # ─── PostgreSQL Database ───────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: carbontracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carbontracker}
      POSTGRES_USER: ${POSTGRES_USER:-carbontracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carbontracker} -d ${POSTGRES_DB:-carbontracker}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - carbontracker-network

  # ─── Backend (FastAPI) ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: production
    container_name: carbontracker-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-carbontracker}:${POSTGRES_PASSWORD:-changeme_in_production}@db:5432/${POSTGRES_DB:-carbontracker}
    volumes:
      - backend_static:/app/static
      - backend_logs:/app/logs
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/system/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - carbontracker-network

  # ─── Frontend (Next.js) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://backend:8001
    container_name: carbontracker-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8001}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - carbontracker-network

  # ─── Nginx Reverse Proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: carbontracker-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - backend_static:/app/static:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - carbontracker-network


# ─── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  backend_static:
    driver: local
  backend_logs:
    driver: local


# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  carbontracker-network:
    driver: bridge
