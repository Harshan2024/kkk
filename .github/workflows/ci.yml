name: CarbonTracker AI — CI/CD Pipeline

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, staging]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/carbontracker

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Backend Lint & Type Check
  # ─────────────────────────────────────────────────────────────────────────
  backend-lint:
    name: "Backend — Lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint dependencies
        run: pip install flake8 pylint

      - name: Run flake8 (syntax & style)
        run: |
          flake8 app/ \
            --max-line-length=120 \
            --ignore=E501,W503,E402 \
            --exclude=__pycache__,.venv
        continue-on-error: true  # Non-blocking lint warnings

      - name: Check for syntax errors only (strict)
        run: |
          python -m py_compile app/main.py
          python -m py_compile app/api/endpoints.py
          python -m py_compile app/utils/metrics.py
          python -m py_compile app/utils/notifier.py
          python -m py_compile app/utils/sanitizer.py


  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Backend Unit Tests
  # ─────────────────────────────────────────────────────────────────────────
  backend-tests:
    name: "Backend — Unit + Integration Tests"
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: carbontracker_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/carbontracker_test
      SECRET_KEY: ci-test-secret-key-for-github-actions-only
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Run unit tests
        run: |
          pytest tests/unit/ \
            -v \
            --tb=short \
            --junit-xml=test-results/unit-results.xml \
            --ignore=tests/unit/test_carbon_calc.py
        continue-on-error: false

      - name: Run integration tests
        run: |
          pytest tests/integration/ \
            -v \
            --tb=short \
            --junit-xml=test-results/integration-results.xml
        continue-on-error: true  # Integration tests may require full DB

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-backend
          path: backend/test-results/


  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Frontend Lint & Build
  # ─────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: "Frontend — Lint + Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true  # Lint warnings are non-blocking

      - name: Build Next.js application
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8001
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: frontend/.next/
          retention-days: 7


  # ─────────────────────────────────────────────────────────────────────────
  # Job 4: Docker Build Validation
  # ─────────────────────────────────────────────────────────────────────────
  docker-build:
    name: "Docker — Build Validation"
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: carbontracker-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: carbontracker-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=http://backend:8001


  # ─────────────────────────────────────────────────────────────────────────
  # Job 5: Security Scan
  # ─────────────────────────────────────────────────────────────────────────
  security-scan:
    name: "Security — Dependency Audit"
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: |
          cd backend
          pip-audit -r requirements.txt --ignore-vuln GHSA-wfm5-v35h-vwf4
        continue-on-error: true  # Inform but don't block

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit npm dependencies
        run: |
          cd frontend
          npm audit --audit-level=high
        continue-on-error: true


